<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Cookie Manager Settings</title>
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }

    .setting {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #4CAF50;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }

    button:hover {
      background: #45a049;
    }

    button:active {
      background: #3d8b40;
    }

    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    .link {
      color: #4CAF50;
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }

    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 15px 0;
    }

    .stats {
      font-size: 12px;
      color: #666;
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
    }

    .stats div {
      margin: 3px 0;
    }
  </style>
</head>
<body>
  <h1>AI Cookie Manager</h1>

  <div class="setting">
    <div class="checkbox-group">
      <input type="checkbox" id="enabled" checked>
      <label for="enabled" style="margin: 0; cursor: pointer;">Enable automatic cookie management</label>
    </div>
  </div>

  <hr>

  <div class="setting">
    <label for="apiKey">Anthropic API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-...">
    <div class="help-text">
      Get your API key from <a href="https://console.anthropic.com/" target="_blank" class="link">console.anthropic.com</a>
    </div>
  </div>

  <button id="saveBtn">Save Settings</button>

  <div id="status" class="status"></div>

  <hr>

  <div class="stats" id="stats">
    <div><strong>Statistics:</strong></div>
    <div>Banners handled: <span id="bannersHandled">0</span></div>
    <div>AI calls made: <span id="aiCalls">0</span></div>
    <div>Status: <span id="extensionStatus">Loading...</span></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
