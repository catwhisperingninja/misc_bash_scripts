# ~/.config/kitty/kitty.conf
# ---------------------------------------------------------------------------
# WINDOW LAYOUTS — the part that trips everyone up
# ---------------------------------------------------------------------------
# In kitty, a "window" is a PANE inside a tab. How panes tile is the "layout".
# Two things you must get right for arbitrary tmux-style splits to work:
#
#   1) Enable the `splits` layout (it is NOT the default). The FIRST entry in
#      enabled_layouts is the default layout for new tabs.
#   2) Use `launch --location=hsplit|vsplit` to actually split — a plain new
#      window in `splits` goes wherever kitty chooses unless you say where.
#
# `stack` = zoom one pane fullscreen (toggle below). Order matters: first = default.
enabled_layouts splits:split_axis=horizontal,stack,tall,fat,grid

# Resize step + behaviour  (NOTE: only ONE enabled_layouts line — a second would override the first)
window_resize_step_cells 2
window_resize_step_lines 2
window_border_width 1.0pt
draw_minimal_borders yes

# ---------------------------------------------------------------------------
# Keybindings for splits  (kitty_mod defaults to ctrl+shift)
# ---------------------------------------------------------------------------
# Create splits with explicit direction (THIS is what people miss):
map kitty_mod+enter   launch --location=hsplit --cwd=current
map kitty_mod+\       launch --location=vsplit --cwd=current
map kitty_mod+minus   launch --location=hsplit --cwd=current

# Move focus between panes
map kitty_mod+left    neighboring_window left
map kitty_mod+right   neighboring_window right
map kitty_mod+up      neighboring_window up
map kitty_mod+down    neighboring_window down

# Move/swap panes around the layout
map kitty_mod+shift+left   move_window left
map kitty_mod+shift+right  move_window right
map kitty_mod+shift+up     move_window up
map kitty_mod+shift+down   move_window down

# Resize panes (start resize mode, then arrows; esc to finish)
map kitty_mod+r       start_resizing_window

# Zoom the focused pane fullscreen and back (uses the `stack` layout)
map kitty_mod+z       toggle_layout stack

# Cycle layouts / rotate the split tree
map kitty_mod+l       next_layout
map kitty_mod+/       layout_action rotate

# ---------------------------------------------------------------------------
# Startup layout — load a saved session of panes/tabs on launch
# ---------------------------------------------------------------------------
# Comment this out if you don't want a fixed layout every time.
startup_session session.conf

# OS-window sizing (the OTHER thing "window layout" can mean)
remember_window_size  no
initial_window_width  1200
initial_window_height 760

# ---------------------------------------------------------------------------
# Look & feel — subtle lime accent (Tailwind lime-400/500)
# ---------------------------------------------------------------------------
active_border_color   #a3e635
inactive_border_color #3f3f46
active_tab_background  #84cc16
active_tab_foreground  #0a0a0a
inactive_tab_background #18181b
inactive_tab_foreground #a1a1aa
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

font_family      monospace
font_size        12.0
scrollback_lines 20000
enable_audio_bell no
confirm_os_window_close 0
