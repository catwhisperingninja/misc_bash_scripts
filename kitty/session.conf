# ~/.config/kitty/session.conf
# Loaded at startup via `startup_session session.conf` in kitty.conf.
# Defines the tabs + pane layout kitty opens with.
#
# Rules:
#   - `layout splits` MUST be set before the launches that split.
#   - The FIRST `launch` creates the root window; subsequent
#     `launch --location=...` split relative to the focused pane.
#   - `cd` sets the working dir for following launches in the tab.

# --- Tab 1: dev (editor on top, two shells split below) ---
new_tab dev
layout splits
cd ~
launch --title editor
launch --location=hsplit --title shell
launch --location=vsplit --title logs

# --- Tab 2: ops (side-by-side) ---
new_tab ops
layout splits
cd ~
launch --title left
launch --location=vsplit --title right

# Focus the first tab on startup
focus_matching_window title:editor
